<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1533" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>PAP WELD CORE — Admin</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0b1533;
        --navy2: #132250;
        --o: #f4511e;
        --a: #f59e0b;
        --t: #0ea5a4;
        --b: #1d4ed8;
        --p: #7c3aed;
        --grad: linear-gradient(
          135deg,
          #f4511e,
          #f59e0b 32%,
          #1d4ed8 68%,
          #7c3aed
        );
        --bg: #f2f4fa;
        --card: #fff;
        --line: #e4e8f2;
        --tx: #0b1533;
        --mu: #66728f;
        --ok: #10b981;
        --er: #ef4444;
        --r: 16px;
        --sh:
          0 1px 2px rgba(11, 21, 51, 0.05), 0 8px 24px rgba(11, 21, 51, 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      .mont {
        font-family: Montserrat, Inter, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
      }
      input,
      select,
      textarea {
        font: inherit;
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--tx);
        outline: 0;
        transition: 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--b);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
      }
      textarea {
        min-height: 84px;
        resize: vertical;
      }

      /* ---------- LOGIN SCREEN ---------- */
      .login-ov {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 20px;
        background:
          radial-gradient(
            1200px 600px at 20% -10%,
            rgba(244, 81, 30, 0.18),
            transparent 60%
          ),
          radial-gradient(
            1000px 600px at 100% 110%,
            rgba(124, 58, 237, 0.22),
            transparent 55%
          ),
          linear-gradient(180deg, var(--navy), #070d22);
      }
      .login-ov::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .login-box {
        width: 100%;
        max-width: 400px;
        margin: auto; /* centers both axes while allowing scroll if too tall */
        background: #fff;
        border-radius: 22px;
        padding: 34px 30px 30px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      .login-logo {
        background: var(--navy);
        border-radius: 16px;
        padding: 16px 18px;
        text-align: center;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
      }
      .login-logo::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .login-logo img {
        max-width: 100%;
        max-height: 58px;
        object-fit: contain;
      }
      .login-logo .fb {
        display: none;
        font: 800 16px Montserrat;
        color: #fff;
        letter-spacing: 0.4px;
      }
      .login-logo .fb span {
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .login-box h2 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        margin-bottom: 4px;
      }
      .login-box .sub {
        color: var(--mu);
        font-size: 13px;
        margin-bottom: 22px;
      }
      .login-box .fg label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 6px;
        color: #334066;
      }
      .pw-wrap {
        position: relative;
      }
      .pw-wrap input {
        padding-right: 46px;
      }
      .pw-toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--mu);
        font-size: 16px;
        transition: 0.15s;
      }
      .pw-toggle:hover {
        background: #f2f4fa;
        color: var(--tx);
      }
      .caps-warn {
        display: none;
        margin-top: 6px;
        font-size: 11.5px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        padding: 5px 9px;
        border-radius: 7px;
        font-weight: 600;
      }
      .login-err {
        color: var(--er);
        font-size: 12.5px;
        font-weight: 600;
        min-height: 18px;
        margin-top: 10px;
        text-align: center;
      }
      .login-box .hint {
        text-align: center;
        color: var(--mu);
        font-size: 11.5px;
        margin-top: 14px;
      }
      .login-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        text-align: center;
        color: rgba(255, 255, 255, 0.35);
        font-size: 11.5px;
        letter-spacing: 0.4px;
        pointer-events: none;
      }

      /* ---------- APP SHELL ---------- */
      .side {
        position: fixed;
        inset: 0 auto 0 0;
        width: 268px;
        background: linear-gradient(180deg, var(--navy), #0a1230);
        color: #fff;
        display: flex;
        flex-direction: column;
        z-index: 50;
        transition: transform 0.3s;
      }
      .side::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .logo {
        margin: 22px 16px 8px;
        background: #fff;
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
      }
      .logo img {
        width: 100%;
        height: auto;
        max-height: 64px;
        object-fit: contain;
      }
      .logo .fb {
        display: none;
        font: 800 15px Montserrat;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
      }
      .nav {
        flex: 1;
        padding: 14px 12px;
      }
      .nav small {
        display: block;
        font: 700 10px Montserrat;
        letter-spacing: 1.4px;
        color: rgba(255, 255, 255, 0.35);
        padding: 10px 12px 6px;
      }
      .nv {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        margin-bottom: 4px;
        text-align: left;
        transition: 0.15s;
      }
      .nv:hover {
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
      }
      .nv.on {
        background: linear-gradient(
          135deg,
          rgba(244, 81, 30, 0.25),
          rgba(124, 58, 237, 0.25)
        );
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .nv b {
        margin-left: auto;
        background: var(--a);
        color: var(--navy);
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 99px;
      }
      .sf {
        padding: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
      }
      .bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--grad);
        border-radius: 9px;
        transition: width 0.4s;
      }
      .logout-btn {
        width: 100%;
        margin-top: 14px;
        padding: 9px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.75);
        font-weight: 600;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        transition: 0.15s;
      }
      .logout-btn:hover {
        background: rgba(239, 68, 68, 0.18);
        color: #fff;
      }
      .main {
        margin-left: 268px;
        min-height: 100vh;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 28px;
        background: rgba(242, 244, 250, 0.85);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        flex: 1;
      }
      .top input {
        max-width: 260px;
        padding: 9px 13px;
      }
      .burger {
        display: none;
        width: 38px;
        height: 38px;
        border-radius: 10px;
        background: var(--navy);
        color: #fff;
        font-size: 18px;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 13px;
        border-radius: 99px;
        background: #fff;
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mu);
      }
      .pill.ok i {
        background: var(--ok);
      }
      .pill.dirty i {
        background: var(--a);
        animation: pl 1s infinite;
      }
      .pill.err i {
        background: var(--er);
      }
      .pill.sync i {
        background: var(--b);
        animation: pl 0.6s infinite;
      }
      @keyframes pl {
        50% {
          opacity: 0.3;
        }
      }
      .pg {
        padding: 26px 28px 60px;
        max-width: 1240px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        border-radius: 11px;
        font-weight: 700;
        font-size: 13px;
        border: 1.5px solid var(--line);
        background: #fff;
        transition: 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--sh);
      }
      .btn.pri {
        background: var(--grad);
        color: #fff;
        border: 0;
        box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3);
      }
      .btn.dk {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .btn.dn {
        color: #b91c1c;
        background: #fef2f2;
        border-color: #fecaca;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      }
      .stats {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        margin-bottom: 22px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--sh);
      }
      .stat {
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .stat::after {
        content: "";
        position: absolute;
        right: -24px;
        top: -24px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0.12;
      }
      .stat small {
        color: var(--mu);
        font-weight: 600;
      }
      .stat h2 {
        font-size: 32px;
        font-weight: 800;
        margin-top: 4px;
      }
      .it {
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
      }
      .it:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px rgba(11, 21, 51, 0.12);
      }
      .th {
        height: 150px;
        background: linear-gradient(135deg, #eef1fb, #e2e8f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        position: relative;
      }
      .th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bd {
        position: absolute;
        top: 10px;
        left: 10px;
        background: var(--grad);
        color: #fff;
        font: 700 10px Montserrat;
        padding: 4px 10px;
        border-radius: 99px;
      }
      .ib {
        padding: 14px 16px 16px;
      }
      .ib h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .ib p {
        color: var(--mu);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .pb {
        height: 6px;
        background: #eef1f8;
        border-radius: 9px;
        overflow: hidden;
      }
      .pb i {
        display: block;
        height: 100%;
        background: var(--grad);
      }
      .pm {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--mu);
        font-weight: 600;
        margin-top: 6px;
      }
      .sec {
        padding: 22px;
        margin-bottom: 18px;
      }
      .sec h3 {
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sec h3 span {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: var(--grad);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
      }
      .fg {
        margin-bottom: 14px;
      }
      .fg > label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 6px;
        color: #334066;
      }
      .g2 {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr;
      }
      .cc {
        text-align: right;
        font-size: 11px;
        color: var(--mu);
        margin-top: 4px;
      }
      .cc.x {
        color: var(--er);
      }
      .ln {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ln button {
        width: 40px;
        flex: none;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        color: var(--mu);
      }
      .ln button:hover {
        background: #fef2f2;
        color: var(--er);
      }
      .add {
        width: 100%;
        padding: 10px;
        border: 1.5px dashed #a5b4fc;
        border-radius: 10px;
        background: #f5f7ff;
        color: var(--b);
        font-weight: 700;
      }
      .up {
        position: relative;
        border: 2px dashed #c7d0e6;
        border-radius: 14px;
        padding: 22px;
        text-align: center;
        background: #fafbff;
        color: var(--mu);
        transition: 0.15s;
      }
      .up:hover,
      .up.dr {
        border-color: var(--p);
        background: #f6f2ff;
      }
      .up.dr {
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      }
      .up input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        padding: 0;
      }
      .tg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .tb {
        position: relative;
        aspect-ratio: 1;
        border-radius: 12px;
        overflow: hidden;
        background: var(--navy);
      }
      .tb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tb button {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(11, 21, 51, 0.85);
        color: #fff;
      }
      .edtop {
        position: sticky;
        top: 64px;
        z-index: 30;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 16px;
        margin-bottom: 18px;
      }
      .edtop h2 {
        flex: 1;
        font-size: 16px;
        min-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--mu);
      }
      .empty div {
        font-size: 52px;
        margin-bottom: 10px;
      }
      .pal {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pal span {
        width: 78px;
        height: 54px;
        border-radius: 12px;
        color: #fff;
        font: 700 10px Montserrat;
        display: flex;
        align-items: flex-end;
        padding: 6px;
        box-shadow: var(--sh);
      }
      .alert {
        padding: 12px 16px;
        border-radius: 12px;
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
        font-size: 12.5px;
        margin-bottom: 16px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translate(-50%, 30px);
        background: var(--navy);
        color: #fff;
        padding: 12px 22px;
        border-radius: 99px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 600;
        box-shadow: var(--sh);
        max-width: 90vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.ok {
        background: #047857;
      }
      .toast.er {
        background: #b91c1c;
      }
      .ov {
        display: none;
      }
      .noscript-msg {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        padding: 30px;
        text-align: center;
        font: 600 15px Inter, sans-serif;
      }
      @media (max-width: 860px) {
        .side {
          transform: translateX(-100%);
        }
        .side.open {
          transform: none;
        }
        .main {
          margin-left: 0;
        }
        .burger {
          display: block;
        }
        .ov.show {
          display: block;
          position: fixed;
          inset: 0;
          background: rgba(0, 0, 0, 0.5);
          z-index: 45;
        }
        .top {
          padding: 12px 14px;
        }
        .top input {
          display: none;
        }
        .pg {
          padding: 16px 14px 60px;
        }
        .g2 {
          grid-template-columns: 1fr;
        }
        .edtop {
          top: 60px;
        }
        /* Prevent iOS Safari from auto-zooming on input focus */
        input,
        select,
        textarea {
          font-size: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>
      <div class="noscript-msg">
        ⚠️ This admin panel requires JavaScript. Please enable it and reload.
      </div>
    </noscript>

    <!-- ============ LOGIN SCREEN ============ -->
    <div class="login-ov" id="loginOv">
      <form
        class="login-box"
        id="loginForm"
        autocomplete="on"
        onsubmit="return false"
      >
        <div class="login-logo">
          <img
            src="images/logo.PNG"
            alt="PAP Weld Core"
            onerror="
              this.style.display = 'none';
              this.nextElementSibling.style.display = 'block';
            "
          />
          <div class="fb">PAP <span>WELD CORE</span></div>
        </div>
        <h2>Admin sign in</h2>
        <p class="sub">Restricted area — authorised users only.</p>
        <div class="fg">
          <label for="lu">Username</label>
          <input
            id="lu"
            name="username"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            required
          />
        </div>
        <div class="fg">
          <label for="lp">Password</label>
          <div class="pw-wrap">
            <input
              id="lp"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              class="pw-toggle"
              type="button"
              id="pwToggle"
              aria-label="Show password"
              title="Show / hide password"
            >
              👁
            </button>
          </div>
          <div class="caps-warn" id="capsWarn">⚠️ Caps Lock is on</div>
        </div>
        <button class="btn pri" type="submit" id="loginBtn" style="width: 100%">
          🔓 Sign in
        </button>
        <p class="login-err" id="lerr"></p>

    <script>
      /* ============================================================

      /* ---------- AUTH ---------- */

      const b64d = (s) => {
        try {
          const bin = atob(s);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          return new TextDecoder().decode(bytes);

      /* ---------- LOGIN FORM ---------- */

      let S = { products: [], services: [] },

            (c) =>
              ({

      /* ---------- UTF-8 safe base64 ---------- */
      function b64encode(str) {
        const bytes = new TextEncoder().encode(str);
        let bin = "";
        for (let k = 0; k < bytes.length; k++)
          bin += String.fromCharCode(bytes[k]);
        return btoa(bin);
      }
      function b64decode(b64) {
        const bin = atob(String(b64).replace(/\n/g, ""));
        const bytes = new Uint8Array(bin.length);
        for (let k = 0; k < bin.length; k++) bytes[k] = bin.charCodeAt(k);
        return new TextDecoder().decode(bytes);

      let toastT;

        const e = $("#toast");

      /* ---------- MODEL ---------- */
      function mk(type, p) {

          name: p.name,
          category: p.category,
          badge: p.badge,
          priceDisplay: p.priceDisplay,
          shortDescription: p.shortDescription,
          description: p.description && { ...p.description },
          specifications:

          features: p.features && [...p.features],
          applications: p.applications && [...p.applications],
          isSample: !!p.isSample,
        });
      }
      function hyd(i) {
        i.id = i.id || uid();
        i.name = i.name || "";
        i.category = i.category || "";
        i.badge = i.badge || "";
        i.priceDisplay = i.priceDisplay || "";
        i.shortDescription = i.shortDescription || "";
        const d = i.description || {};
        i.description = { p1: d.p1 || "", p2: d.p2 || "", p3: d.p3 || "" };
        if (!Array.isArray(i.specifications) || !i.specifications.length)
          i.specifications = [{ label: "", value: "" }];
        if (!Array.isArray(i.features) || !i.features.length) i.features = [""];
        if (!Array.isArray(i.applications) || !i.applications.length)
          i.applications = [""];
        i.images = i.images || { main: null, gallery: [] };
        i.images.gallery = (i.images.gallery || []).map((g) => ({
          ...g,
          gid: g.gid || uid(),
        }));
        i.brochure = i.brochure || null;
        return i;
      }
      const pct = (i) =>
        Math.round(
          ([
            i.name.trim(),
            i.category,
            i.shortDescription.trim(),
            i.description.p1 || i.description.p2 || i.description.p3,
            i.specifications.some((s) => s.label && s.value),
            i.features.some((f) => f.trim()),
            i.applications.some((a) => a.trim()),
            i.images.main,
          ].filter(Boolean).length /
            8) *
            100,
        );
      const all = () => [...S.products, ...S.services];
      const cur = () => all().find((i) => i.id === activeId);

      function saveLocal() {
        try {
          let j = JSON.stringify(S);

            const lt = (x) => ({

              images: {
                main:
                  x.images.main && x.images.main.url

                  .map((g) => ({ ...g, dataUrl: null })),

              products: S.products.map(lt),

          c = "err";
          t = txt || "Save failed";

          c = "dirty";
          t = cloud() ? "Unsaved · autosave soon" : "Unsaved · local only";
        } else if (!cloud()) {
          t = "Local mode";

          c = "ok";
          t = lastSave
            ? "Saved " +
              lastSave.toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",

        p.className = "pill " + c;
        $("#pt").textContent = t;

      /* ---------- GITHUB ---------- */
      const H = () => ({
        Authorization: "Bearer " + cfg.token,
        Accept: "application/vnd.github+json",
      });
      const API = (p) =>
        `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${p}`;
      async function ghGet(p) {
        const r = await fetch(API(p) + "?ref=" + cfg.branch, {
          headers: H(),
          cache: "no-store",
        });
        if (r.status === 404) return null;
        if (!r.ok) throw Error(p + " → HTTP " + r.status);
        return r.json();
      }
      async function ghPut(p, b64, sha) {
        const r = await fetch(API(p), {
          method: "PUT",
          headers: { ...H(), "Content-Type": "application/json" },
          body: JSON.stringify({
            message: "Update " + p,
            content: b64,
            branch: cfg.branch,
            ...(sha ? { sha } : {}),
          }),
        });
        if (!r.ok) {
          let m = "";
          try {
            m = (await r.json()).message;
          } catch (e) {}
          throw Error(p + " → HTTP " + r.status + " " + m);
        }
        return r.json();
      }
      async function upload(obj, path) {
        if (!obj || !obj.dataUrl || obj.up === obj.dataUrl.length) return;
        const ex = await ghGet(path).catch(() => null);
        await ghPut(path, obj.dataUrl.split(",")[1], ex && ex.sha);
        obj.url = RAW(path);
        obj.up = obj.dataUrl.length;
      }
      function clean(i, inline) {
        const f = (o) =>
          o && {
            filename: o.filename || "",
            url: o.url || null,
            ...(o.gid ? { gid: o.gid } : {}),

          slug: slug(i.name),

      }
      function render() {
        if (!isAuthed()) return; // safety: never render app content pre-login
        $("#cp").textContent = S.products.length;
        $("#cs").textContent = S.services.length;
        document
          .querySelectorAll(".nv")
          .forEach((b) => b.classList.toggle("on", b.dataset.v === view));
        const a = all(),
          g = a.length
            ? Math.round(a.reduce((s, i) => s + pct(i), 0) / a.length)
            : 0;
        $("#gp").textContent = g + "%";
        $("#gb").style.width = g + "%";
        $("#ttl").textContent = activeId
          ? "Edit " + (cur()?.type === "service" ? "Service" : "Product")
          : TITLES[view];
        $("#pg").innerHTML =
          activeId && cur()
            ? editor(cur())
            : view === "dash"
              ? dash(a, g)
              : view === "settings"
                ? settings()
                : list(view);
        pill();
      }
      function card(i) {
        const s = src(i.images.main),
          p = pct(i);
        return `<div class="card it" data-open="${i.id}"><div class="th">${
          s
            ? `<img src="${esc(s)}" loading="lazy">`
            : i.type === "service"
              ? "⚙️"
              : "📦"
        }${i.badge ? `<span class="bd">${esc(i.badge)}</span>` : ""}</div>
 <div class="ib"><h3>${esc(i.name || "Untitled " + i.type)}</h3><p>${esc(i.category || "No category")}${i.priceDisplay ? " · " + esc(i.priceDisplay) : ""}</p><div class="pb"><i style="width:${p}%"></i></div><div class="pm"><span>Completion</span><span>${p}%</span></div></div></div>`;
      }
      function dash(a, g) {
        const low = a.filter((i) => pct(i) < 80);
        return `<div class="stats">
 <div class="card stat" style="--c:var(--o)"><small>Products</small><h2>${S.products.length}</h2></div>
 <div class="card stat" style="--c:var(--b)"><small>Services</small><h2>${S.services.length}</h2></div>
 <div class="card stat" style="--c:var(--t)"><small>Avg. completion</small><h2>${g}%</h2></div>
 <div class="card stat" style="--c:var(--p)"><small>Needs attention</small><h2>${low.length}</h2></div></div>
 ${
   cloud()
     ? ""
     : '<div class="alert">⚠️ GitHub is not connected — changes are saved in this browser only. Open <b>GitHub &amp; Brand</b> to add your token.</div>'
 }
 <div class="row" style="margin-bottom:18px"><button class="btn pri" data-new="product">＋ New Product</button><button class="btn dk" data-new="service">＋ New Service</button>
 <button class="btn" data-act="load">⬇ Load from GitHub</button><button class="btn" data-act="dl">⬇ Download JSON</button><button class="btn" data-act="copy">📋 Copy JSON</button>
 <button class="btn" data-act="samples">📌 Load samples</button></div>
 ${
   low.length
     ? `<h3 class="mont" style="margin-bottom:12px">Finish these next</h3><div class="grid">${low.slice(0, 6).map(card).join("")}</div>`
     : a.length
       ? ""
       : '<div class="empty"><div>🚀</div><h3>Nothing here yet</h3><p>Add your first product or load the samples.</p></div>'
 }`;
      }
      function list(v) {
        const t = v === "products" ? "product" : "service";
        const s = q.toLowerCase();
        const L = (t === "product" ? S.products : S.services).filter((i) => {
          if (!s) return true;
          return (
            (i.name || "").toLowerCase().includes(s) ||
            (i.category || "").toLowerCase().includes(s) ||
            (i.shortDescription || "").toLowerCase().includes(s) ||
            (i.priceDisplay || "").toLowerCase().includes(s)
          );
        });
        return `<div class="row" style="justify-content:space-between;margin-bottom:18px"><p style="color:var(--mu)">${t === "product" ? "Machines and equipment you manufacture" : "Installation, maintenance, training & custom work"}</p><button class="btn pri" data-new="${t}">＋ Add ${t === "product" ? "Product" : "Service"}</button></div>
 ${
   L.length
     ? `<div class="grid">${L.map(card).join("")}</div>`
     : `<div class="empty"><div>${t === "product" ? "📦" : "⚙️"}</div><h3>No ${v} found</h3></div>`
 }`;
      }
      function lines(i, key, ph, two) {
        return (
          i[key]
            .map(
              (x, n) =>
                `<div class="ln">${
                  two
                    ? `<input data-l="${key}" data-k="label" data-i="${n}" value="${esc(x.label)}" placeholder="Label"><input data-l="${key}" data-k="value" data-i="${n}" value="${esc(x.value)}" placeholder="Value">`
                    : `<input data-l="${key}" data-i="${n}" value="${esc(x)}" placeholder="${ph}">`
                }<button data-del="${key}" data-i="${n}">✕</button></div>`,
            )
            .join("") + `<button class="add" data-add="${key}">＋ Add</button>`
        );
      }
      function editor(i) {
        const sv = i.type === "service",
          cats = sv ? SCATS : PCATS,
          ms = src(i.images.main);
        const F = (k, l, ph, ex) =>
          `<div class="fg"><label>${l}</label><input data-f="${k}" value="${esc(i[k])}" placeholder="${ph}" ${ex || ""}></div>`;
        return `<div class="card edtop"><button class="btn" data-act="back">← Back</button><h2>${esc(i.name || "Untitled")}</h2>
 <button class="btn" data-act="dup">⧉ Duplicate</button><button class="btn dn" data-act="del">🗑 Delete</button><button class="btn pri" data-act="save">💾 Save</button></div>
 <div class="card sec"><h3><span>1</span>Basic info</h3>${F(
   "name",
   (sv ? "Service" : "Product") + " name *",
   "e.g. PTW - Pull Thru Welding Machine",
 )}
 <div class="g2"><div class="fg"><label>Category</label><select data-f="category"><option value="">— Select —</option>${cats
   .map((c) => `<option ${i.category === c ? "selected" : ""}>${c}</option>`)
   .join("")}</select></div>
 <div class="fg"><label>Badge</label><select data-f="badge">${BADGES.map(
   (b) =>
     `<option value="${b}" ${i.badge === b ? "selected" : ""}>${b || "— None —"}</option>`,
 ).join("")}</select></div></div>
 ${F(
   "priceDisplay",
   (sv ? "Rate" : "Price") + " (blank = hidden)",
   "e.g. ₹85,000 / year",
 )}
 <div class="fg"><label>Short description (max ${MAXS})</label><input data-f="shortDescription" maxlength="${MAXS}" value="${esc(i.shortDescription)}"><div class="cc ${
   i.shortDescription.length > MAXS ? "x" : ""
 }" id="cc">${i.shortDescription.length} / ${MAXS}</div></div></div>
 <div class="card sec"><h3><span>2</span>Full description</h3>
 ${[
   ["p1", sv ? "What is this service?" : "What is this machine?"],
   ["p2", "How does it work?"],
   ["p3", "Why choose this?"],
 ]
   .map(
     ([k, l]) =>
       `<div class="fg"><label>${l}</label><textarea data-f="description.${k}">${esc(i.description[k])}</textarea></div>`,
   )
   .join("")}</div>
 <div class="card sec"><h3><span>3</span>${sv ? "Service details" : "Specifications"}</h3>${lines(i, "specifications", "", 1)}</div>
 <div class="card sec"><h3><span>4</span>Key features</h3>${lines(i, "features", "Feature")}</div>
 <div class="card sec"><h3><span>5</span>Applications / industries</h3>${lines(i, "applications", "e.g. PEB")}</div>
 <div class="card sec"><h3><span>6</span>Photos</h3>
 <div class="fg"><label>Main photo</label><div class="up" data-up-zone="main">📷 Tap, drop or paste a main photo<input type="file" accept="image/*" data-up="main"></div>${
   ms
     ? `<div class="tg"><div class="tb"><img src="${esc(ms)}"><button data-act="rmMain">✕</button></div></div>`
     : ""
 }</div>
 <div class="fg"><label>Gallery (${i.images.gallery.length}/${MAXG})</label><div class="up" data-up-zone="gallery">🖼️ Drop or tap to add gallery photos<input type="file" accept="image/*" multiple data-up="gallery"></div>
 <div class="tg">${i.images.gallery
   .map(
     (g, n) =>
       `<div class="tb"><img src="${esc(src(g))}"><button data-rg="${n}">✕</button></div>`,
   )
   .join("")}</div></div></div>
 <div class="card sec"><h3><span>7</span>Brochure PDF</h3><div class="up" data-up-zone="brochure">📄 ${
   i.brochure
     ? esc(i.brochure.filename || "brochure.pdf") + " attached — drop or tap to replace"
     : "Drop or tap to attach a PDF (optional)"
 }<input type="file" accept="application/pdf" data-up="brochure"></div>${
   i.brochure
     ? '<button class="btn dn" style="margin-top:10px" data-act="rmBro">Remove</button>'
     : ""
 }</div>`;
      }
      function settings() {
        return `<div class="card sec"><h3><span>🔐</span>GitHub connection</h3>
 <div class="alert">Your token is stored only in this browser (localStorage), never in the code. Use a <b>fine-grained token</b> limited to this one repo with <b>Contents: Read &amp; write</b>. Keep this admin page private — don't host it publicly.</div>
 <div class="g2"><div class="fg"><label>Owner</label><input id="c_owner" value="${esc(cfg.owner)}"></div><div class="fg"><label>Repository</label><input id="c_repo" value="${esc(cfg.repo)}"></div>
 <div class="fg"><label>Branch</label><input id="c_branch" value="${esc(cfg.branch)}"></div><div class="fg"><label>Data file</label><input id="c_dataPath" value="${esc(cfg.dataPath)}"></div></div>
 <div class="fg"><label>Personal access token</label><input id="c_token" type="password" value="${esc(cfg.token)}" placeholder="github_pat_…"></div>
 <div class="row"><button class="btn pri" data-act="cfg">Save settings</button><button class="btn" data-act="test">Test connection</button></div></div>
 <div class="card sec"><h3><span>🎨</span>Brand palette (from your logo)</h3><div class="pal">${PAL.map(
   ([n, c]) => `<span style="background:${c}">${n}<br>${c}</span>`,
 ).join("")}</div>
 <p style="color:var(--mu);margin-top:12px;font-size:12.5px">Logo file: <code>images/logo.PNG</code> · Favicon: <code>images/favicon.ico</code></p></div>`;
      }

      /* ---------- SHARED UPLOAD HANDLER ---------- */
      async function handleUpload(kind, files, item) {
        if (!files.length) return;
        if (kind === "main") {
          item.images.main = await compress(files[0]);
          toast("Main photo added", "ok");
        } else if (kind === "gallery") {
          const room = MAXG - item.images.gallery.length;
          if (room <= 0) {
            toast("Gallery full", "er");
            return;
          }
          toast("Processing…");
          for (const f of files.slice(0, room))
            item.images.gallery.push(await compress(f));
        } else if (kind === "brochure") {
          const f = files[0];
          if (f.size > 8e6 && !confirm("PDF is over 8 MB. Continue?")) return;
          item.brochure = await new Promise((r) => {
            const x = new FileReader();
            x.onload = () => r({ filename: f.name, dataUrl: x.result });
            x.readAsDataURL(f);
          });
          toast("Brochure attached", "ok");
        }
        touch();
        render();
      }

      /* ---------- EVENTS ---------- */
      document.addEventListener("click", async (e) => {
        const t = e.target,
          c = (s) => t.closest(s);
        if (c(".nv") && c(".nv").dataset.v) return setView(c(".nv").dataset.v);
        if (c("#bg")) {
          $("#side").classList.toggle("open");
          $("#ov").classList.toggle("show");
          return;
        }
        if (c("#ov")) {
          $("#side").classList.remove("open");
          $("#ov").classList.remove("show");
          return;
        }
        if (c("#saveNow")) return ghSave(true);
        if (c("[data-new]")) {
          const ty = c("[data-new]").dataset.new,
            it = mk(ty);
          (ty === "product" ? S.products : S.services).push(it);
          view = ty + "s";
          activeId = it.id;
          touch();
          render();
          setTimeout(() => $("[data-f=name]")?.focus(), 80);
          return;
        }
        if (c("[data-open]")) {
          const id = c("[data-open]").dataset.open,
            it = all().find((x) => x.id === id);
          view = it.type + "s";
          activeId = id;
          render();
          scrollTo(0, 0);
          return;
        }
        const i = cur(),
          d = t.closest("[data-del]"),
          ad = t.closest("[data-add]"),
          rg = t.closest("[data-rg]"),
          a = c("[data-act]")?.dataset.act;
        if (i && d) {
          const L = i[d.dataset.del];
          L.splice(+d.dataset.i, 1);
          if (!L.length)
            L.push(
              d.dataset.del === "specifications"
                ? { label: "", value: "" }
                : "",
            );
          touch();
          render();
          return;
        }
        if (i && ad) {
          i[ad.dataset.add].push(
            ad.dataset.add === "specifications" ? { label: "", value: "" } : "",
          );
          touch();
          render();
          return;
        }
        if (i && rg) {
          i.images.gallery.splice(+rg.dataset.rg, 1);
          touch();
          render();
          return;
        }
        if (!a) return;
        if (a === "back") {
          activeId = null;
          render();
        } else if (a === "save") {
          ghSave(true);
        } else if (
          a === "del" &&
          i &&
          confirm(
            'Delete "' + (i.name || "Untitled") + '"? This cannot be undone.',
          )
        ) {
          const L = i.type === "product" ? S.products : S.services;
          L.splice(L.indexOf(i), 1);
          activeId = null;
          touch();
          render();
          toast("Deleted");
        } else if (a === "dup" && i) {
          const n = JSON.parse(JSON.stringify(i));
          n.id = uid();
          n.name += " (copy)";
          n.isSample = false;
          n.images.gallery = n.images.gallery.map((g) => ({
            ...g,
            gid: uid(),
          }));
          (i.type === "product" ? S.products : S.services).push(n);
          activeId = n.id;
          touch();
          render();
          toast("Duplicated", "ok");
        } else if (a === "rmMain" && i) {
          i.images.main = null;
          touch();
          render();
        } else if (a === "rmBro" && i) {
          i.brochure = null;
          touch();
          render();
        } else if (a === "load") ghLoad();
        else if (a === "dl") {
          const b = new Blob([JSON.stringify(payload(true), null, 2)], {
              type: "application/json",
            }),
            l = document.createElement("a");
          l.href = URL.createObjectURL(b);
          l.download = "papweld-products-services.json";
          l.click();
          toast("Downloaded", "ok");
        } else if (a === "copy") {
          try {
            await navigator.clipboard.writeText(
              JSON.stringify(payload(true), null, 2),
            );
            toast("Copied", "ok");
          } catch (_) {
            toast("Copy failed", "er");
          }
        } else if (a === "samples") {
          [
            ["product", S.products],
            ["service", S.services],
          ].forEach(([ty, L]) => {
            if (!L.some((x) => x.isSample))
              L.unshift(mk(ty, { ...SAMPLES[ty], isSample: true }));
          });
          touch();
          render();
          toast("Samples loaded", "ok");
        } else if (a === "cfg" || a === "test") {
          ["owner", "repo", "branch", "dataPath", "token"].forEach(
            (k) => (cfg[k] = $("#c_" + k).value.trim()),
          );
          localStorage.setItem(CK, JSON.stringify(cfg));
          pill();
          if (a === "cfg") toast("Settings saved", "ok");
          else
            try {
              const r = await fetch(
                `https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,
                { headers: H() },
              );
              const j = await r.json();
              toast(
                r.ok
                  ? j.permissions && j.permissions.push
                    ? "Connected ✓ write access"
                    : "Connected, but read-only"
                  : "Failed: " + (j.message || r.status),
                r.ok && j.permissions?.push ? "ok" : "er",
              );
            } catch (_) {
              toast("Network error", "er");
            }
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "q") {
          q = t.value;
          if (!activeId && (view === "products" || view === "services"))
            $("#pg").innerHTML = list(view);
          return;
        }
        const i = cur();
        if (!i) return;
        if (t.dataset.f) {
          const [k, s] = t.dataset.f.split(".");
          s ? (i[k][s] = t.value) : (i[k] = t.value);
          if (k === "shortDescription") {
            const c = $("#cc");
            c.textContent = t.value.length + " / " + MAXS;
            c.className = "cc" + (t.value.length > MAXS ? " x" : "");
          }
          if (k === "name") {
            $(".edtop h2").textContent = t.value || "Untitled";
          }
          touch();
        } else if (t.dataset.l) {
          const L = i[t.dataset.l],
            n = +t.dataset.i;
          t.dataset.k ? (L[n][t.dataset.k] = t.value) : (L[n] = t.value);
          touch();
        }
      });

      /* ---------- FILE INPUT CHANGE ---------- */
      document.addEventListener("change", async (e) => {
        const up = e.target.dataset.up;
        const i = cur();
        if (!up || !i) return;
        await handleUpload(up, [...e.target.files], i);
        e.target.value = ""; // allow re-selecting the same file
      });

      /* ---------- DRAG & DROP ---------- */
      ["dragenter", "dragover"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          const up = e.target.closest?.(".up");
          if (!up) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
          up.classList.add("dr");
        }),
      );
      ["dragleave", "dragend"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          const up = e.target.closest?.(".up");
          if (!up) return;
          // Ignore leave events when moving into a child element
          if (e.relatedTarget && up.contains(e.relatedTarget)) return;
          up.classList.remove("dr");
        }),
      );
      document.addEventListener("drop", async (e) => {
        const up = e.target.closest?.(".up");
        if (!up) return;
        e.preventDefault();
        up.classList.remove("dr");
        const input = up.querySelector("input[type=file]");
        const kind = input?.dataset.up;
        const i = cur();
        if (!kind || !i) return;
        const files = [...(e.dataTransfer?.files || [])].filter((f) => {
          if (kind === "brochure") return /pdf$/i.test(f.type);
          return /^image\//i.test(f.type);
        });
        if (!files.length) {
          toast("Unsupported file type", "er");
          return;
        }
        await handleUpload(kind, files, i);
      });

      function compress(f) {
        return new Promise((res) => {
          const r = new FileReader();
          r.onload = () => {
            const im = new Image();
            im.onload = () => {
              const s = Math.min(1, 1400 / Math.max(im.width, im.height)),
                c = document.createElement("canvas");
              c.width = im.width * s;
              c.height = im.height * s;
              c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
              res({
                gid: uid(),
                filename: f.name.replace(/\.\w+$/, "") + ".jpg",
                dataUrl: c.toDataURL("image/jpeg", 0.78),
              });
            };
            im.src = r.result;
          };
          r.readAsDataURL(f);
        });
      }

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          if (isAuthed()) ghSave(true);
        }
      });

      addEventListener("beforeunload", (e) => {
        saveLocal();
        if (dirty && cloud()) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          saveLocal();
          if (dirty && cloud()) ghSave(false);
        }
      });

      /* ---------- BOOT APP DATA ---------- */
      loadLocal();
      // render() is only meaningful (and safe) once logged in —
      // the login handler and bootAuth call it when appropriate.
      if (isAuthed()) render();
    </script>
  </body>
</html>
