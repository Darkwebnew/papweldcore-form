<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b1533" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>PAP WELD CORE — Admin</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico" />
    <link rel="apple-touch-icon" href="images/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy: #0b1533;
        --navy2: #132250;
        --o: #f4511e;
        --a: #f59e0b;
        --t: #0ea5a4;
        --b: #1d4ed8;
        --p: #7c3aed;
        --grad: linear-gradient(
          135deg,
          #f4511e,
          #f59e0b 32%,
          #1d4ed8 68%,
          #7c3aed
        );
        --bg: #f2f4fa;
        --card: #fff;
        --line: #e4e8f2;
        --tx: #0b1533;
        --mu: #66728f;
        --ok: #10b981;
        --er: #ef4444;
        --r: 16px;
        --sh:
          0 1px 2px rgba(11, 21, 51, 0.05), 0 8px 24px rgba(11, 21, 51, 0.06);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        scroll-behavior: smooth;
      }
      html,
      body {
        background: var(--bg);
        color: var(--tx);
        font:
          14px/1.5 Inter,
          system-ui,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body {
        overflow-x: hidden;
        overflow-y: auto;
        min-height: 100dvh;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior-y: auto;
      }
      h1,
      h2,
      h3,
      h4,
      .mont {
        font-family: Montserrat, Inter, sans-serif;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
        touch-action: manipulation;
      }
      input,
      select,
      textarea {
        font: inherit;
        width: 100%;
        padding: 11px 13px;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        background: #fff;
        color: var(--tx);
        outline: 0;
        transition: 0.15s;
      }
      input:focus,
      select:focus,
      textarea:focus {
        border-color: var(--b);
        box-shadow: 0 0 0 4px rgba(29, 78, 216, 0.1);
      }
      textarea {
        min-height: 84px;
        resize: vertical;
      }

      /* ---------- LOGIN SCREEN ---------- */
      .login-ov {
        position: fixed;
        inset: 0;
        z-index: 500;
        display: flex;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
        padding: 20px;
        background:
          radial-gradient(
            1200px 600px at 20% -10%,
            rgba(244, 81, 30, 0.18),
            transparent 60%
          ),
          radial-gradient(
            1000px 600px at 100% 110%,
            rgba(124, 58, 237, 0.22),
            transparent 55%
          ),
          linear-gradient(180deg, var(--navy), #070d22);
      }
      .login-ov::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .login-box {
        width: 100%;
        max-width: 400px;
        margin: auto;
        background: #fff;
        border-radius: 22px;
        padding: 34px 30px 30px;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        position: relative;
      }
      .login-logo {
        background: var(--navy);
        border-radius: 16px;
        padding: 16px 18px;
        text-align: center;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
      }
      .login-logo::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .login-logo img {
        max-width: 100%;
        max-height: 58px;
        object-fit: contain;
      }
      .login-logo .fb {
        display: none;
        font: 800 16px Montserrat;
        color: #fff;
        letter-spacing: 0.4px;
      }
      .login-logo .fb span {
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .login-box h2 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        margin-bottom: 4px;
      }
      .login-box .sub {
        color: var(--mu);
        font-size: 13px;
        margin-bottom: 22px;
      }
      .login-box .fg label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 6px;
        color: #334066;
      }
      .pw-wrap {
        position: relative;
      }
      .pw-wrap input {
        padding-right: 46px;
      }
      .pw-toggle {
        position: absolute;
        top: 50%;
        right: 6px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: var(--mu);
        font-size: 16px;
        transition: 0.15s;
      }
      .pw-toggle:hover {
        background: #f2f4fa;
        color: var(--tx);
      }
      .caps-warn {
        display: none;
        margin-top: 6px;
        font-size: 11.5px;
        color: #b45309;
        background: #fffbeb;
        border: 1px solid #fde68a;
        padding: 5px 9px;
        border-radius: 7px;
        font-weight: 600;
      }
      .login-err {
        color: var(--er);
        font-size: 12.5px;
        font-weight: 600;
        min-height: 18px;
        margin-top: 10px;
        text-align: center;
      }
      .login-box .hint {
        text-align: center;
        color: var(--mu);
        font-size: 11.5px;
        margin-top: 14px;
      }
      .login-foot {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 18px;
        text-align: center;
        color: rgba(255, 255, 255, 0.35);
        font-size: 11.5px;
        letter-spacing: 0.4px;
        pointer-events: none;
      }

      /* ---------- APP SHELL ---------- */
      .side {
        position: fixed;
        top: 0;
        left: 0;
        width: 268px;
        height: 100dvh;
        background: linear-gradient(180deg, var(--navy), #0a1230);
        color: #fff;
        display: flex;
        flex-direction: column;
        z-index: 50;
        transition: transform 0.3s;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }
      .side::before {
        content: "";
        position: absolute;
        inset: 0 0 auto;
        height: 4px;
        background: var(--grad);
      }
      .logo {
        margin: 22px 16px 8px;
        background: #fff;
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        flex: 0 0 auto;
      }
      .logo img {
        width: 100%;
        height: auto;
        max-height: 64px;
        object-fit: contain;
      }
      .logo .fb {
        display: none;
        font: 800 15px Montserrat;
        background: var(--grad);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        text-align: center;
      }
      .nav {
        flex: 1 0 auto;
        padding: 14px 12px;
      }
      .nav small {
        display: block;
        font: 700 10px Montserrat;
        letter-spacing: 1.4px;
        color: rgba(255, 255, 255, 0.35);
        padding: 10px 12px 6px;
      }
      .nv {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        margin-bottom: 4px;
        text-align: left;
        transition: 0.15s;
      }
      .nv:hover {
        background: rgba(255, 255, 255, 0.07);
        color: #fff;
      }
      .nv.on {
        background: linear-gradient(
          135deg,
          rgba(244, 81, 30, 0.25),
          rgba(124, 58, 237, 0.25)
        );
        color: #fff;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
      }
      .nv b {
        margin-left: auto;
        background: var(--a);
        color: var(--navy);
        font-size: 11px;
        padding: 1px 8px;
        border-radius: 99px;
      }
      .sf {
        padding: 16px;
        border-top: 1px solid rgba(255, 255, 255, 0.08);
        font-size: 12px;
        color: rgba(255, 255, 255, 0.6);
        flex: 0 0 auto;
      }
      .bar {
        height: 6px;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 9px;
        overflow: hidden;
        margin-top: 6px;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--grad);
        border-radius: 9px;
        transition: width 0.4s;
      }
      .logout-btn {
        width: 100%;
        margin-top: 14px;
        padding: 9px 12px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.75);
        font-weight: 600;
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
        justify-content: center;
        transition: 0.15s;
      }
      .logout-btn:hover {
        background: rgba(239, 68, 68, 0.18);
        color: #fff;
      }
      .main {
        margin-left: 268px;
        min-height: 100dvh;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 28px;
        background: rgba(242, 244, 250, 0.9);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--line);
      }
      .top h1 {
        font-size: 20px;
        font-weight: 800;
        letter-spacing: -0.3px;
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .top input {
        max-width: 280px;
        padding: 9px 13px;
      }
      .burger {
        display: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: var(--navy);
        color: #fff;
        font-size: 18px;
        place-items: center;
        flex: 0 0 auto;
      }
      .pill {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 13px;
        border-radius: 99px;
        background: #fff;
        border: 1px solid var(--line);
        white-space: nowrap;
      }
      .pill i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--mu);
        flex: 0 0 auto;
      }
      .pill.ok i {
        background: var(--ok);
      }
      .pill.dirty i {
        background: var(--a);
        animation: pl 1s infinite;
      }
      .pill.err i {
        background: var(--er);
      }
      .pill.sync i {
        background: var(--b);
        animation: pl 0.6s infinite;
      }
      @keyframes pl {
        50% {
          opacity: 0.3;
        }
      }
      .pg {
        padding: 26px 28px 60px;
        max-width: 1240px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        padding: 10px 18px;
        border-radius: 11px;
        font-weight: 700;
        font-size: 13px;
        border: 1.5px solid var(--line);
        background: #fff;
        transition: 0.15s;
      }
      .btn:hover {
        transform: translateY(-1px);
        box-shadow: var(--sh);
      }
      .btn.pri {
        background: var(--grad);
        color: #fff;
        border: 0;
        box-shadow: 0 6px 18px rgba(124, 58, 237, 0.3);
      }
      .btn.dk {
        background: var(--navy);
        color: #fff;
        border-color: var(--navy);
      }
      .btn.dn {
        color: #b91c1c;
        background: #fef2f2;
        border-color: #fecaca;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .row {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        align-items: center;
      }
      .grid {
        display: grid;
        gap: 18px;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr));
      }
      .stats {
        display: grid;
        gap: 16px;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr));
        margin-bottom: 22px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--sh);
      }
      .stat {
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .stat::after {
        content: "";
        position: absolute;
        right: -24px;
        top: -24px;
        width: 90px;
        height: 90px;
        border-radius: 50%;
        background: var(--c);
        opacity: 0.12;
      }
      .stat small {
        color: var(--mu);
        font-weight: 600;
      }
      .stat h2 {
        font-size: 32px;
        font-weight: 800;
        margin-top: 4px;
      }
      .it {
        overflow: hidden;
        cursor: pointer;
        transition: 0.2s;
      }
      .it:hover {
        transform: translateY(-3px);
        box-shadow: 0 14px 34px rgba(11, 21, 51, 0.12);
      }
      .th {
        height: 150px;
        background: linear-gradient(135deg, #eef1fb, #e2e8f7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        position: relative;
      }
      .th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .bd {
        position: absolute;
        top: 10px;
        left: 10px;
        background: var(--grad);
        color: #fff;
        font: 700 10px Montserrat;
        padding: 4px 10px;
        border-radius: 99px;
      }
      .ib {
        padding: 14px 16px 16px;
      }
      .ib h3 {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 2px;
      }
      .ib p {
        color: var(--mu);
        font-size: 12px;
        margin-bottom: 10px;
      }
      .pb {
        height: 6px;
        background: #eef1f8;
        border-radius: 9px;
        overflow: hidden;
      }
      .pb i {
        display: block;
        height: 100%;
        background: var(--grad);
      }
      .pm {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: var(--mu);
        font-weight: 600;
        margin-top: 6px;
      }
      .sec {
        padding: 22px;
        margin-bottom: 18px;
      }
      .sec h3 {
        font-size: 12px;
        letter-spacing: 1px;
        text-transform: uppercase;
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .sec h3 span {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        background: var(--grad);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 12px;
        flex: 0 0 auto;
      }
      .fg {
        margin-bottom: 14px;
      }
      .fg > label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        margin-bottom: 6px;
        color: #334066;
      }
      .g2 {
        display: grid;
        gap: 14px;
        grid-template-columns: 1fr 1fr;
      }
      .cc {
        text-align: right;
        font-size: 11px;
        color: var(--mu);
        margin-top: 4px;
      }
      .cc.x {
        color: var(--er);
      }
      .ln {
        display: flex;
        gap: 8px;
        margin-bottom: 8px;
      }
      .ln button {
        width: 40px;
        flex: none;
        border: 1.5px solid var(--line);
        border-radius: 10px;
        color: var(--mu);
      }
      .ln button:hover {
        background: #fef2f2;
        color: var(--er);
      }
      .add {
        width: 100%;
        padding: 10px;
        border: 1.5px dashed #a5b4fc;
        border-radius: 10px;
        background: #f5f7ff;
        color: var(--b);
        font-weight: 700;
      }
      .up {
        position: relative;
        border: 2px dashed #c7d0e6;
        border-radius: 14px;
        padding: 22px;
        text-align: center;
        background: #fafbff;
        color: var(--mu);
        transition: 0.15s;
      }
      .up:hover,
      .up.dr {
        border-color: var(--p);
        background: #f6f2ff;
      }
      .up.dr {
        box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
      }
      .up input {
        position: absolute;
        inset: 0;
        opacity: 0;
        cursor: pointer;
        padding: 0;
      }
      .tg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 10px;
        margin-top: 12px;
      }
      .tb {
        position: relative;
        aspect-ratio: 1;
        border-radius: 12px;
        overflow: hidden;
        background: var(--navy);
      }
      .tb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .tb button {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: rgba(11, 21, 51, 0.85);
        color: #fff;
      }
      .edtop {
        position: sticky;
        top: 64px;
        z-index: 30;
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        padding: 12px 16px;
        margin-bottom: 18px;
      }
      .edtop h2 {
        flex: 1;
        font-size: 16px;
        min-width: 120px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .empty {
        text-align: center;
        padding: 70px 20px;
        color: var(--mu);
      }
      .empty div {
        font-size: 52px;
        margin-bottom: 10px;
      }
      .pal {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pal span {
        width: 78px;
        height: 54px;
        border-radius: 12px;
        color: #fff;
        font: 700 10px Montserrat;
        display: flex;
        align-items: flex-end;
        padding: 6px;
        box-shadow: var(--sh);
      }
      .alert {
        padding: 12px 16px;
        border-radius: 12px;
        background: #fffbeb;
        border: 1px solid #fde68a;
        color: #92400e;
        font-size: 12.5px;
        margin-bottom: 16px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(28px + env(safe-area-inset-bottom));
        transform: translate(-50%, 30px);
        background: var(--navy);
        color: #fff;
        padding: 12px 22px;
        border-radius: 99px;
        font-weight: 600;
        opacity: 0;
        pointer-events: none;
        transition: 0.3s;
        z-index: 600;
        box-shadow: var(--sh);
        max-width: 90vw;
        text-align: center;
      }
      .toast.show {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .toast.ok {
        background: #047857;
      }
      .toast.er {
        background: #b91c1c;
      }
      .ov {
        display: none;
      }
      .noscript-msg {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-items: center;
        background: var(--navy);
        color: #fff;
        padding: 30px;
        text-align: center;
        font: 600 15px Inter, sans-serif;
      }

      /* ---------- CATALOG (dashboard one-by-one adder) ---------- */
      .cat-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin: 26px 0 6px;
      }
      .cat-head h3 {
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.2px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .cat-count {
        font: 700 11.5px Montserrat;
        background: linear-gradient(135deg, #ecfdf5, #e0e7ff);
        color: #1e3a8a;
        border: 1px solid #c7d2fe;
        padding: 5px 11px;
        border-radius: 99px;
        white-space: nowrap;
      }
      .cat-hint {
        color: var(--mu);
        font-size: 12.5px;
        margin-bottom: 16px;
        line-height: 1.5;
      }
      .cat-hint b {
        color: var(--b);
      }
      .cat-it {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        transition: 0.2s;
      }
      .cat-it:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(11, 21, 51, 0.1);
      }
      .cat-th {
        position: relative;
        height: 128px;
        background: linear-gradient(135deg, #eef1fb, #e2e8f7);
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .cat-th img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .cat-ph {
        font-size: 34px;
        opacity: 0.55;
      }
      .cat-ib {
        padding: 12px 14px 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        flex: 1;

      async function ghSave(manual) {
        if (!cloud()) {
          saveLocal();
          if (manual)
            toast(
              "Saved locally · add a GitHub token in Settings to sync",
              "ok",
            );
          return;
        }
        if (saving) {
          if (manual) toast("Already saving…");
          return;
        }
        const bad = all().find((i) => !i.name.trim());
        if (bad && manual)
          toast(
            'Tip: "' + bad.type + '" without a name was saved as Untitled',
            "",
          );
        saving = true;
        pill();
        clearTimeout(tC);
        try {
          for (const i of all()) {
            await upload(i.images.main, `images/${i.id}-main.jpg`);
            for (const g of i.images.gallery)
              await upload(g, `images/${i.id}-gallery-${g.gid}.jpg`);
            if (
              i.brochure &&
              i.brochure.dataUrl &&
              i.brochure.up !== i.brochure.dataUrl.length
            ) {
              const p = `brochures/${i.id}.pdf`;
              const ex = await ghGet(p).catch(() => null);
              await ghPut(p, i.brochure.dataUrl.split(",")[1], ex && ex.sha);
              i.brochure.url = RAW(p) + "?v=" + Date.now();
              i.brochure.up = i.brochure.dataUrl.length;
            }
          }
          const b64 = b64encode(JSON.stringify(payload(false), null, 2));
          const ex = await ghGet(cfg.dataPath).catch(() => null);
          await ghPut(cfg.dataPath, b64, ex && ex.sha);
          saveLocal();
          dirty = false;
          lastSave = new Date();
          saving = false;
          pill();
          if (manual) toast("Saved to GitHub ✓", "ok");
        } catch (e) {
          console.warn(e);
          saving = false;
          dirty = true;
          pill("err", "Save failed");
          toast(e.message.slice(0, 70), "er");
        }
      }
      async function ghLoad() {
        if (!cloud()) {

        }

          return;
        try {
          const f = await ghGet(cfg.dataPath);
          if (!f) {
            toast("No data.json in repo yet", "er");
            return;
          }
          const raw = JSON.parse(b64decode(f.content));
          const rc = (r, t) =>
            hyd({
              id: r.id,
              type: t,
              name: r.name,
              category: r.category,
              badge: r.badge,
              priceDisplay: r.priceDisplay,
              shortDescription: r.shortDescription,
              description: {
                p1: r.description?.paragraph1,
                p2: r.description?.paragraph2,
                p3: r.description?.paragraph3,
              },
              specifications: r.specifications,
              features: r.keyFeatures,
              applications: r.applications,
              images: {
                main: r.images?.main
                  ? { ...r.images.main, dataUrl: null }
                  : null,
                gallery: (r.images?.gallery || []).map((g) => ({

                  dataUrl: null,
                })),
              },
              brochure: r.brochure ? { ...r.brochure, dataUrl: null } : null,
              isSample: !!r.isSample,
              catalogId: r.catalogId || null,

          S.products = (raw.products || []).map((r) => rc(r, "product"));

          saveLocal();
          dirty = false;
          lastSave = new Date();

        if (s.length > MAXS) s = s.slice(0, MAXS - 1).trim() + "…";
        return s;

          applications: (r.a || []).map((x) =>

      /* ---------- SHARED UPLOAD HANDLER ---------- */
      async function handleUpload(kind, files, item) {
        if (!files.length) return;
        if (kind === "main") {
          item.images.main = await compress(files[0]);
          toast("Main photo added", "ok");
        } else if (kind === "gallery") {
          const room = MAXG - item.images.gallery.length;
          if (room <= 0) {
            toast("Gallery full", "er");
            return;
          }
          toast("Processing…");
          for (const f of files.slice(0, room))
            item.images.gallery.push(await compress(f));
        } else if (kind === "brochure") {
          const f = files[0];
          if (f.size > 8e6 && !confirm("PDF is over 8 MB. Continue?")) return;
          item.brochure = await new Promise((r) => {
            const x = new FileReader();
            x.onload = () => r({ filename: f.name, dataUrl: x.result });
            x.readAsDataURL(f);
          });
          toast("Brochure attached", "ok");
        }
        touch();
        render();
      }

            toast("Already added");

              d.dataset.del === "specifications"

          render();

          render();
          return;

          render();

          render();

          ghSave(true);

          a === "del" &&

          n.isSample = false;
          const strip = (img) => (img ? { ...img, up: null, url: null } : img);
          n.images.main = strip(n.images.main);
          n.images.gallery = n.images.gallery.map((g) => ({
            ...strip(g),
            gid: uid(),
          }));
          if (n.brochure) n.brochure = strip(n.brochure);
          (i.type === "product" ? S.products : S.services).push(n);
          activeId = n.id;
          touch();
          render();
          toast("Duplicated", "ok");
        } else if (a === "rmMain" && i) {
          i.images.main = null;
          touch();
          render();
        } else if (a === "rmBro" && i) {
          i.brochure = null;
          touch();
          render();
        } else if (a === "load") ghLoad();
        else if (a === "dl") {
          const b = new Blob([JSON.stringify(payload(true), null, 2)], {
              type: "application/json",
            }),
            l = document.createElement("a");
          l.href = URL.createObjectURL(b);
          l.download = "papweld-products-services.json";
          l.click();
          toast("Downloaded", "ok");
        } else if (a === "copy") {
          try {
            await navigator.clipboard.writeText(
              JSON.stringify(payload(true), null, 2),
            );
            toast("Copied", "ok");
          } catch (_) {
            toast("Copy failed", "er");
          }
        } else if (a === "samples") {
          [
            ["product", S.products],
            ["service", S.services],
          ].forEach(([ty, L]) => {
            if (!L.some((x) => x.isSample))
              L.unshift(mk(ty, { ...SAMPLES[ty], isSample: true }));
          });
          touch();
          render();
          toast("Samples loaded", "ok");
        } else if (a === "cfg" || a === "test") {
          ["owner", "repo", "branch", "dataPath", "token"].forEach(
            (k) => (cfg[k] = $("#c_" + k).value.trim()),
          );
          localStorage.setItem(CK, JSON.stringify(cfg));
          pill();
          if (a === "cfg") toast("Settings saved", "ok");
          else
            try {
              const r = await fetch(
                `https://api.github.com/repos/${cfg.owner}/${cfg.repo}`,
                { headers: H() },
              );
              const j = await r.json();
              toast(
                r.ok
                  ? j.permissions && j.permissions.push
                    ? "Connected ✓ write access"
                    : "Connected, but read-only"
                  : "Failed: " + (j.message || r.status),
                r.ok && j.permissions?.push ? "ok" : "er",
              );
            } catch (_) {
              toast("Network error", "er");
            }
        }
      });

      document.addEventListener("input", (e) => {
        const t = e.target;
        if (t.id === "q") {
          q = t.value;
          if (activeId) return;
          if (view === "products" || view === "services") {
            $("#pg").innerHTML = list(view);
          } else if (view === "dash") {
            render();
          }
          return;
        }
        const i = cur();
        if (!i) return;
        if (t.dataset.f) {
          const [k, s] = t.dataset.f.split(".");
          s ? (i[k][s] = t.value) : (i[k] = t.value);
          if (k === "shortDescription") {
            const c = $("#cc");
            c.textContent = t.value.length + " / " + MAXS;
            c.className = "cc" + (t.value.length > MAXS ? " x" : "");
          }
          if (k === "name") {
            $(".edtop h2").textContent = t.value || "Untitled";
          }
          touch();
        } else if (t.dataset.l) {
          const L = i[t.dataset.l],
            n = +t.dataset.i;
          t.dataset.k ? (L[n][t.dataset.k] = t.value) : (L[n] = t.value);
          touch();
        }
      });

      /* ---------- FILE INPUT CHANGE ---------- */
      document.addEventListener("change", async (e) => {
        const up = e.target.dataset.up;
        const i = cur();
        if (!up || !i) return;
        await handleUpload(up, [...e.target.files], i);
        e.target.value = "";
      });

      /* ---------- DRAG & DROP (safe on mobile too) ---------- */
      ["dragenter", "dragover"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          e.preventDefault();
          const up = e.target.closest?.(".up");
          if (!up) return;
          e.dataTransfer.dropEffect = "copy";
          up.classList.add("dr");
        }),
      );
      ["dragleave", "dragend"].forEach((ev) =>
        document.addEventListener(ev, (e) => {
          const up = e.target.closest?.(".up");
          if (!up) return;
          if (e.relatedTarget && up.contains(e.relatedTarget)) return;
          up.classList.remove("dr");
        }),
      );
      document.addEventListener("drop", async (e) => {
        e.preventDefault();
        const up = e.target.closest?.(".up");
        if (!up) return;
        up.classList.remove("dr");
        const input = up.querySelector("input[type=file]");
        const kind = input?.dataset.up;
        const i = cur();
        if (!kind || !i) return;
        const files = [...(e.dataTransfer?.files || [])].filter((f) => {
          if (kind === "brochure") return /pdf$/i.test(f.type);
          return /^image\//i.test(f.type);
        });
        if (!files.length) {
          toast("Unsupported file type", "er");
          return;
        }
        await handleUpload(kind, files, i);
      });

      function compress(f) {
        return new Promise((res) => {
          const r = new FileReader();
          r.onload = () => {
            const im = new Image();
            im.onload = () => {
              const s = Math.min(1, 1400 / Math.max(im.width, im.height)),
                c = document.createElement("canvas");
              c.width = im.width * s;
              c.height = im.height * s;
              c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
              res({
                gid: uid(),
                filename: f.name.replace(/\.\w+$/, "") + ".jpg",
                dataUrl: c.toDataURL("image/jpeg", 0.78),
              });
            };
            im.src = r.result;
          };
          r.readAsDataURL(f);
        });
      }

      document.addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key === "s") {
          e.preventDefault();
          if (isAuthed()) ghSave(true);
        }
      });

      addEventListener("beforeunload", (e) => {
        saveLocal();
        if (dirty && cloud()) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          saveLocal();
          if (dirty && cloud()) ghSave(false);
        }
      });

      /* ---------- BOOT APP DATA ---------- */
      loadLocal();
      if (isAuthed()) render();
    </script>
  </body>
</html>
